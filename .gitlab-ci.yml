stages:
  - lint
  - test
  - build
  - deploy

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

.php_base:
  image: php:8.3-cli
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" gd zip pdo_mysql
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --prefer-dist
  cache:
    key: composer-${CI_COMMIT_REF_SLUG}
    paths:
      - .composer-cache
      - vendor

lint:phpcs:
  extends: .php_base
  stage: lint
  script:
    - vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme web/modules/custom web/themes/custom scripts
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:phpstan:
  extends: .php_base
  stage: lint
  script:
    - vendor/bin/phpstan analyse --no-progress
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:twig:
  image: php:8.3-cli
  stage: lint
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer global require -q friendsoftwig/twigcs
  script:
    - /root/.composer/vendor/bin/twigcs web/themes/custom
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

lint:css:
  image: node:20-alpine
  stage: lint
  script:
    - npx --yes stylelint "web/themes/custom/**/*.css" --config .stylelintrc.json || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

test:phpunit:
  extends: .php_base
  stage: test
  services:
    - mariadb:10.11
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: drupal_test
    SIMPLETEST_DB: "mysql://root:root@mariadb/drupal_test"
    SIMPLETEST_BASE_URL: "http://localhost"
    BROWSERTEST_OUTPUT_DIRECTORY: "/tmp"
  script:
    - vendor/bin/phpunit --configuration web/core/phpunit.xml.dist web/modules/custom
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

test:a11y:
  image: php:8.3-cli
  stage: test
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev libsqlite3-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" gd zip pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --prefer-dist
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -yqq nodejs
    - apt-get install -yqq chromium libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0
    - export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    - export PUPPETEER_EXECUTABLE_PATH=$(command -v chromium || command -v chromium-browser)
    - npm install -g pa11y-ci
  script:
    # Site jetable (SQLite) reproduisant la configuration versionnée, pour
    # auditer les gabarits clés avec pa11y-ci (axe-core + HTML_CodeSniffer).
    - vendor/bin/drush site-install minimal --db-url=sqlite://sites/default/files/.ht.sqlite --locale=fr --site-name=Ambassade -y
    - vendor/bin/drush config-import -y
    - vendor/bin/drush php:script scripts/ci-demo-content.php
    - vendor/bin/drush cache:rebuild
    - php -S 127.0.0.1:8888 -t web >/tmp/php-server.log 2>&1 &
    - sleep 3
    - pa11y-ci --config .pa11yci.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

test:lighthouse:
  image: php:8.3-cli
  stage: test
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev libsqlite3-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" gd zip pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --prefer-dist
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -yqq nodejs
    - apt-get install -yqq chromium libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0
    - export CHROME_PATH=$(command -v chromium || command -v chromium-browser)
    - npm install -g @lhci/cli
  script:
    # Même principe que test:a11y : site jetable SQLite + contenu de
    # démonstration, cibles Lighthouse mobile >= 90 (accueil, démarche,
    # actualité) définies dans .lighthouserc.json.
    - vendor/bin/drush site-install minimal --db-url=sqlite://sites/default/files/.ht.sqlite --locale=fr --site-name=Ambassade -y
    - vendor/bin/drush config-import -y
    - vendor/bin/drush php:script scripts/ci-demo-content.php
    - vendor/bin/drush cache:rebuild
    - php -S 127.0.0.1:8888 -t web >/tmp/php-server.log 2>&1 &
    - sleep 3
    - lhci autorun --config=.lighthouserc.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

build:artifact:
  extends: .php_base
  stage: build
  script:
    - composer install --no-dev --no-interaction --no-progress --optimize-autoloader
  artifacts:
    paths:
      - vendor/
      - web/
      - config/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:production:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Déploiement — voir docs/decisions/ pour la procédure retenue (Lot 6)."
    # - drush deploy (exécuté sur l'environnement cible via SSH/pipeline dédié)
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
